[project]
name = "exam-brief-backend"
version = "0.1.0"
description = "Public exam morning briefing API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<1",
  "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7",
  "trafilatura>=2,<3",
  "pyyaml>=6,<7",
  "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "aiosqlite>=0.21,<1",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["feedparser", "apscheduler.*"]
ignore_missing_imports = true
