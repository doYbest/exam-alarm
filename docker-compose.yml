services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exambrief
      POSTGRES_USER: exambrief
      POSTGRES_PASSWORD: exambrief
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - exambrief_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exambrief -d exambrief"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://exambrief:exambrief@db:5432/exambrief
    command: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://exambrief:exambrief@db:5432/exambrief
    command: .venv/bin/python -m app.worker
    depends_on:
      db:
        condition: service_healthy
volumes:
  exambrief_db:
